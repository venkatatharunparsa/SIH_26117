# KWB demo — Ollama is INFERENCE ONLY.
# Policy (binding):
#   - NEVER run `ollama pull` / registry download from this workbench or demo box.
#   - Adopt ONLY models already present in the local Ollama store (Laptop-A).
#   - G1: ≥2 task→card routes with distinct model_ids when staged on A.
#   - Multimodal: vision-scan → moondream (image/scan). Sequential load on 8GB VRAM.

llm_base_url: "http://127.0.0.1:11434"
bind_host: "127.0.0.1"
bind_port: 8080

# Phone hotspot two-laptop: do NOT edit this permanently.
# On Laptop-B use: .\scripts\hotspot_link_workbench.ps1 -ServerIp <A-IP>
# (sets SOVEREIGN_LLM_BASE_URL + SOVEREIGN_INFERENCE_ALLOW_HOSTS for that shell)

# inference_allow_hosts:
#   - "192.168.43.10"
# station_token: "demo-station-2026"

policy:
  runtime: ollama
  inference_only: true
  no_pull: true
  no_registry: true
  adopt: local_tags_only
  adopted_at: "2026-09-20"
  adopted_chat_tags: ["llama3.2:3b", "qwen2.5-coder:7b"]
  adopted_vision_tags: ["moondream"]
  not_adopted: ["nomic-embed-text:latest"]

cards:
  - id: inspect-draft
    model_id: llama3.2:3b
    enabled: true
    task_families: [inspection]
  - id: code-assist
    model_id: qwen2.5-coder:7b
    enabled: true
    task_families: [coding]
  - id: vision-scan
    model_id: moondream
    enabled: true
    task_families: [vision, multimodal]
  - id: general-fallback
    model_id: llama3.2:3b
    enabled: true
    task_families: [inspection, coding, freestyle]
